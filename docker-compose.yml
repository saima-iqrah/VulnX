# Usage: copy .env.example to .env, fill the values, then: docker compose up -d --build
services:
  db:
    image: postgres:17-alpine
    restart: unless-stopped
    environment:
      POSTGRES_DB: vulnx_db
      POSTGRES_USER: vulnx_app
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD:?Set POSTGRES_PASSWORD in .env}
    volumes:
      - pgdata:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U vulnx_app -d vulnx_db"]
      interval: 5s
      timeout: 5s
      retries: 10

  api:
    build: .
    restart: unless-stopped
    depends_on:
      db:
        condition: service_healthy
    environment:
      ASPNETCORE_ENVIRONMENT: Production
      ConnectionStrings__Default: Host=db;Port=5432;Database=vulnx_db;Username=vulnx_app;Password=${POSTGRES_PASSWORD}
      Jwt__Key: ${JWT_KEY:?Set JWT_KEY in .env (48+ random characters)}
      Database__MigrateOnStart: "true"
      Cors__AllowedOrigins__0: ${PUBLIC_URL:-http://localhost:8080}
      Frontend__BaseUrl: ${PUBLIC_URL:-http://localhost:8080}
      Seed__Enabled: ${SEED_ENABLED:-false}
      Seed__AdminEmail: ${SEED_ADMIN_EMAIL:-}
      Seed__AdminPassword: ${SEED_ADMIN_PASSWORD:-}
    ports:
      - "8080:8080"

volumes:
  pgdata:
